name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate dummy Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=IN, O=Android, CN=Android Debug"

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{
            "project_info": {"project_number": "123","project_id": "dummy"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123:android:dummy","android_client_info": {"package_name": "com.example"}},"oauth_client": [],"api_key": [{"current_key": "dummy"}],"services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }' > app/google-services.json

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
